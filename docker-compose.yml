services:
  # Only invoked by process.sh; it never starts with the application stack.
  secrets-init:
    profiles: [setup]
    build:
      context: ./backend
    user: "${SECRET_SETUP_UID:-1000}:${SECRET_SETUP_GID:-1000}"
    entrypoint: ["node", "scripts/sync-docker-secrets.js"]
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/.secrets:/app/.secrets

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5175:5175"

    volumes:
      # Mount development files individually so backend/.env is never exposed.
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/upload:/app/upload
      - ./backend/.secret:/app/.secret:ro
      - /app/node_modules

    env_file:
      - path: ./backend/.secrets/backend.env
        format: raw
        required: false # Allows `docker compose up -d mongo` before secret setup.

    environment:
      SECRETS_ONLY: "true"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MONGO_URI_FILE: /run/secrets/mongo_uri
      LINE_CHANNEL_ACCESS_TOKEN_FILE: /run/secrets/line_channel_access_token
      LINE_CHANNEL_SECRET_FILE: /run/secrets/line_channel_secret
      COOKIE_SECRET_FILE: /run/secrets/cookie_secret
      DATA_GO_API_KEY_FILE: /run/secrets/data_go_api_key
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key

    secrets:
      - jwt_secret
      - mongo_uri
      - line_channel_access_token
      - line_channel_secret
      - cookie_secret
      - data_go_api_key
      - csrf_secret
      - resend_api_key
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0.0

    ports:
      - "27017:27017"

    environment:
      # CAUTIOUS
      # Docker Desktop’s Linux VM is kernel 6.19+; Mongo 8.0 refuses to boot without this.
      # https://jira.mongodb.org/browse/SERVER-121912
      GLIBC_TUNABLES: glibc.pthread.rseq=1

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]

      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:5175/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:

secrets:
  jwt_secret:
    file: ./backend/.secrets/jwt_secret
  mongo_uri:
    file: ./backend/.secrets/mongo_uri
  line_channel_access_token:
    file: ./backend/.secrets/line_channel_access_token
  line_channel_secret:
    file: ./backend/.secrets/line_channel_secret
  cookie_secret:
    file: ./backend/.secrets/cookie_secret
  data_go_api_key:
    file: ./backend/.secrets/data_go_api_key
  csrf_secret:
    file: ./backend/.secrets/csrf_secret
  resend_api_key:
    file: ./backend/.secrets/resend_api_key
