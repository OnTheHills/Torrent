services:
  backend:
    build:
      context: ./backend

    ports:
      - "5175:5175"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]

      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    image: csp_frontend:1.0.0
    container_name: csp_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
