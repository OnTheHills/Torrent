services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5175:5175"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0.0

    ports:
      - "27017:27017"

    environment:
      # CAUTIOUS
      # Docker Desktop’s Linux VM is kernel 6.19+; Mongo 8.0 refuses to boot without this.
      # https://jira.mongodb.org/browse/SERVER-121912
      GLIBC_TUNABLES: glibc.pthread.rseq=1

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]

      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:5175/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
