services:
  # Only invoked by process.sh; it never starts with the application stack.
  secrets-init:
    profiles: [setup]
    build:
      context: ./backend
    user: "${SECRET_SETUP_UID:-1000}:${SECRET_SETUP_GID:-1000}"
    entrypoint: ["node", "scripts/sync-docker-secrets.js"]
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/.secrets:/app/.secrets

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5175:5175"

    volumes:
      # Persist uploads and mount provider credentials separately from the image.
      - ./backend/upload:/app/upload
      - ./backend/.secret:/app/.secret:ro

    env_file:
      - path: ./backend/.env
        required: false

    environment:
      NODE_ENV: production
      # env_file supplies ordinary settings. Override every raw secret with an
      # empty value, even when it is still present in .env during provisioning.
      JWT_SECRET: ""
      MONGO_URI: ""
      LINE_CHANNEL_ACCESS_TOKEN: ""
      LINE_CHANNEL_SECRET: ""
      COOKIE_SECRET: ""
      DATA_GO_API_KEY: ""
      CSRF_SECRET: ""
      RESEND_API_KEY: ""
      # Clear the legacy host URI too, in case it remains in a local env file.
      MONGO_URI_HOST: ""
      SECRETS_ONLY: "true"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MONGO_URI_FILE: /run/secrets/mongo_uri
      LINE_CHANNEL_ACCESS_TOKEN_FILE: /run/secrets/line_channel_access_token
      LINE_CHANNEL_SECRET_FILE: /run/secrets/line_channel_secret
      COOKIE_SECRET_FILE: /run/secrets/cookie_secret
      DATA_GO_API_KEY_FILE: /run/secrets/data_go_api_key
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key

    secrets:
      - jwt_secret
      - mongo_uri
      - line_channel_access_token
      - line_channel_secret
      - cookie_secret
      - data_go_api_key
      - csrf_secret
      - resend_api_key
    networks:
      - application

  frontend:
    build:
      context: ./frontend
      secrets:
        - frontend_build_env
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:5175/api
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      - backend
    networks:
      - application

networks:
  application:

secrets:
  frontend_build_env:
    file: ./frontend/.env
  jwt_secret:
    file: ./backend/.secrets/jwt_secret
  mongo_uri:
    file: ./backend/.secrets/mongo_uri
  line_channel_access_token:
    file: ./backend/.secrets/line_channel_access_token
  line_channel_secret:
    file: ./backend/.secrets/line_channel_secret
  cookie_secret:
    file: ./backend/.secrets/cookie_secret
  data_go_api_key:
    file: ./backend/.secrets/data_go_api_key
  csrf_secret:
    file: ./backend/.secrets/csrf_secret
  resend_api_key:
    file: ./backend/.secrets/resend_api_key
