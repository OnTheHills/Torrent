<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#F9FAFC"/>
  <text x="64" y="48" font-family="Arial,sans-serif" font-size="16" fill="#69758C">Software Development Security · Slide 8</text>
  <text x="64" y="92" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#1C2433">Which Threats Matter Most</text>
  <text x="64" y="122" font-family="Arial,sans-serif" font-size="16" fill="#69758C">Likelihood × Impact · 3×3 risk matrix · top 3 priorities</text>

  <!-- Axis labels -->
  <text x="520" y="860" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#313A4C" text-anchor="middle">IMPACT ’</text>
  <text x="48" y="520" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#313A4C" transform="rotate(-90 48 520)">LIKELIHOOD ’</text>

  <!-- Column headers -->
  <text x="250" y="175" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#69758C" text-anchor="middle">Low</text>
  <text x="520" y="175" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#69758C" text-anchor="middle">Medium</text>
  <text x="790" y="175" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#69758C" text-anchor="middle">High</text>

  <!-- Row labels (High at top) -->
  <text x="115" y="290" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#69758C" text-anchor="middle">High</text>
  <text x="115" y="470" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#69758C" text-anchor="middle">Med</text>
  <text x="115" y="650" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#69758C" text-anchor="middle">Low</text>

  <!-- Cells: x=160/430/700, y=200/380/560, size 250x160 -->
  <!-- High likelihood row -->
  <rect x="160" y="200" width="250" height="160" fill="#FFF3CD" stroke="#fff" stroke-width="4"/>
  <rect x="430" y="200" width="250" height="160" fill="#F8D7DA" stroke="#fff" stroke-width="4"/>
  <rect x="700" y="200" width="250" height="160" fill="#DC3545" stroke="#fff" stroke-width="4" opacity="0.85"/>
  <!-- Med likelihood row -->
  <rect x="160" y="380" width="250" height="160" fill="#D1E7DD" stroke="#fff" stroke-width="4"/>
  <rect x="430" y="380" width="250" height="160" fill="#FFF3CD" stroke="#fff" stroke-width="4"/>
  <rect x="700" y="380" width="250" height="160" fill="#F8D7DA" stroke="#fff" stroke-width="4"/>
  <!-- Low likelihood row -->
  <rect x="160" y="560" width="250" height="160" fill="#D1E7DD" stroke="#fff" stroke-width="4"/>
  <rect x="430" y="560" width="250" height="160" fill="#D1E7DD" stroke="#fff" stroke-width="4"/>
  <rect x="700" y="560" width="250" height="160" fill="#FFF3CD" stroke="#fff" stroke-width="4"/>

  <!-- Threat dots -->
  <!-- High-High: 1, 2, 13 -->
  <circle cx="760" cy="255" r="22" fill="#1C2433"/><text x="760" y="261" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">1</text>
  <circle cx="820" cy="290" r="22" fill="#1C2433"/><text x="820" y="296" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">2</text>
  <circle cx="780" cy="325" r="22" fill="#1C2433"/><text x="780" y="331" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">13</text>
  <!-- High-Med: 8 -->
  <circle cx="555" cy="280" r="22" fill="#1C2433"/><text x="555" y="286" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">8</text>
  <!-- High-Low: 11 -->
  <circle cx="285" cy="280" r="22" fill="#1C2433"/><text x="285" y="286" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">11</text>
  <!-- Med-High: 3, 9 -->
  <circle cx="760" cy="430" r="22" fill="#1C2433"/><text x="760" y="436" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">3</text>
  <circle cx="830" cy="470" r="22" fill="#1C2433"/><text x="830" y="476" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">9</text>
  <!-- Med-Med: 4, 5, 10 -->
  <circle cx="480" cy="430" r="22" fill="#1C2433"/><text x="480" y="436" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">4</text>
  <circle cx="555" cy="460" r="22" fill="#1C2433"/><text x="555" y="466" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">5</text>
  <circle cx="520" cy="500" r="22" fill="#1C2433"/><text x="520" y="506" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">10</text>
  <!-- Med-Low: 12 -->
  <circle cx="285" cy="460" r="22" fill="#1C2433"/><text x="285" y="466" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">12</text>
  <!-- Low-High: 14 -->
  <circle cx="790" cy="640" r="22" fill="#1C2433"/><text x="790" y="646" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">14</text>
  <!-- Low-Med: 7 -->
  <circle cx="555" cy="640" r="22" fill="#1C2433"/><text x="555" y="646" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">7</text>
  <!-- Low-Low: 6 -->
  <circle cx="285" cy="640" r="22" fill="#1C2433"/><text x="285" y="646" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">6</text>

  <!-- Side panel -->
  <rect x="1020" y="200" width="520" height="520" rx="12" fill="#fff" stroke="#D7DCE6"/>
  <text x="1048" y="245" font-family="Arial" font-size="20" font-weight="700" fill="#E46C31">TOP 3 PRIORITIES</text>

  <circle cx="1068" cy="300" r="18" fill="#DC3545"/><text x="1068" y="306" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">1</text>
  <text x="1100" y="296" font-family="Arial" font-size="16" font-weight="700" fill="#1C2433">Stolen / forged JWT session</text>
  <text x="1100" y="318" font-family="Arial" font-size="13" fill="#69758C">High likelihood · High impact · S</text>

  <circle cx="1068" cy="380" r="18" fill="#DC3545"/><text x="1068" y="386" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">2</text>
  <text x="1100" y="376" font-family="Arial" font-size="16" font-weight="700" fill="#1C2433">Privilege escalation to admin</text>
  <text x="1100" y="398" font-family="Arial" font-size="13" fill="#69758C">High likelihood · High impact · E (#13)</text>

  <circle cx="1068" cy="460" r="18" fill="#DC3545"/><text x="1068" y="466" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">3</text>
  <text x="1100" y="456" font-family="Arial" font-size="16" font-weight="700" fill="#1C2433">PII / vendor profile leak</text>
  <text x="1100" y="478" font-family="Arial" font-size="13" fill="#69758C">Med likelihood · High impact · I (#8)</text>

  <text x="1048" y="540" font-family="Arial" font-size="14" font-weight="700" fill="#1C2433">Zone key</text>
  <rect x="1048" y="560" width="28" height="20" rx="4" fill="#D1E7DD"/><text x="1088" y="575" font-family="Arial" font-size="13" fill="#313A4C">Low  accept / monitor</text>
  <rect x="1048" y="595" width="28" height="20" rx="4" fill="#FFF3CD"/><text x="1088" y="610" font-family="Arial" font-size="13" fill="#313A4C">Medium  mitigate soon</text>
  <rect x="1048" y="630" width="28" height="20" rx="4" fill="#F8D7DA"/><text x="1088" y="645" font-family="Arial" font-size="13" fill="#313A4C">High / Critical  fix first</text>
  <rect x="1048" y="665" width="28" height="20" rx="4" fill="#DC3545" opacity="0.85"/><text x="1088" y="680" font-family="Arial" font-size="13" fill="#313A4C">Critical  top priorities</text>
</svg>
