<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">TORRENT Data Flow Diagram with Trust Boundaries</title>
  <desc id="desc">DFD showing external entities, processes, data stores, numbered flows, and dashed red trust boundaries between internet, application, and database.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#313A4C"/>
    </marker>
    <style>
      .bg { fill: #F9FAFC; }
      .zone-label { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #E46C31; letter-spacing: 0.08em; text-transform: uppercase; }
      .title { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 36px; font-weight: 600; fill: #1C2433; }
      .sub { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 16px; fill: #69758C; }
      .entity { fill: #FFFFFF; stroke: #1C2433; stroke-width: 2.5; }
      .process { fill: #F0FAF6; stroke: #5EB299; stroke-width: 3; }
      .store { fill: #FBE6D8; stroke: #E46C31; stroke-width: 2.5; }
      .label { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1C2433; text-anchor: middle; }
      .small { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 12px; fill: #69758C; text-anchor: middle; }
      .flow { stroke: #313A4C; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-num { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .num-bg { fill: #E46C31; }
      .tb { fill: none; stroke: #D32F2F; stroke-width: 3; stroke-dasharray: 10 8; }
      .tb-tag { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #D32F2F; }
      .legend-box { fill: #FFFFFF; stroke: #D7DCE6; stroke-width: 1.5; }
      .legend { font-family: Prompt, Calibri, Arial, sans-serif; font-size: 13px; fill: #313A4C; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Title -->
  <text class="sub" x="64" y="48">Software Development Security · Slide 6</text>
  <text class="title" x="64" y="92">Where Attacks Can Happen</text>
  <text class="sub" x="64" y="122">TORRENT data flow diagram · entry points · trust boundaries · data stores</text>

  <!-- Zone backgrounds -->
  <rect x="40" y="150" width="380" height="620" rx="12" fill="#FFF7F2" stroke="#F0A06E" stroke-width="1.5"/>
  <text class="zone-label" x="60" y="180">Internet / External</text>

  <rect x="460" y="150" width="680" height="620" rx="12" fill="#F0FAF6" stroke="#5EB299" stroke-width="1.5"/>
  <text class="zone-label" x="480" y="180">Application trust zone</text>

  <rect x="1180" y="150" width="380" height="620" rx="12" fill="#FBE6D8" stroke="#E46C31" stroke-width="1.5"/>
  <text class="zone-label" x="1200" y="180">Data trust zone</text>

  <!-- Trust boundaries (dashed red) -->
  <line class="tb" x1="440" y1="150" x2="440" y2="770"/>
  <text class="tb-tag" x="352" y="760" transform="rotate(-90 352 760)">TB1 · Internet ” Server</text>

  <line class="tb" x1="1160" y1="150" x2="1160" y2="770"/>
  <text class="tb-tag" x="1172" y="760" transform="rotate(-90 1172 760)">TB2 · Server ” Database</text>

  <!-- Outer boundary hint around externals vs app is TB1; also note external services on left cross TB1 -->

  <!-- ========== EXTERNAL ENTITIES (left) ========== -->
  <!-- User -->
  <rect class="entity" x="80" y="220" width="160" height="70" rx="4"/>
  <text class="label" x="160" y="250">Vendor / Admin</text>
  <text class="small" x="160" y="270">Browser user</text>

  <!-- Google -->
  <rect class="entity" x="80" y="330" width="160" height="70" rx="4"/>
  <text class="label" x="160" y="360">Google Auth</text>
  <text class="small" x="160" y="380">External IdP</text>

  <!-- TOR sources -->
  <rect class="entity" x="80" y="440" width="160" height="70" rx="4"/>
  <text class="label" x="160" y="470">TOR Sources</text>
  <text class="small" x="160" y="490">e-GP · BMA · data.go</text>

  <!-- Vertex -->
  <rect class="entity" x="80" y="550" width="160" height="70" rx="4"/>
  <text class="label" x="160" y="580">Vertex AI</text>
  <text class="small" x="160" y="600">Extract / match</text>

  <!-- LINE -->
  <rect class="entity" x="80" y="660" width="160" height="70" rx="4"/>
  <text class="label" x="160" y="690">LINE API</text>
  <text class="small" x="160" y="710">Webhook / digest</text>

  <!-- ========== PROCESSES (center) ========== -->
  <!-- P1 Next.js -->
  <ellipse class="process" cx="620" cy="300" rx="110" ry="70"/>
  <text class="label" x="620" y="292">P1 Next.js UI</text>
  <text class="small" x="620" y="314">Public / Vendor / Admin</text>

  <!-- P2 Express -->
  <ellipse class="process" cx="900" cy="420" rx="130" ry="85"/>
  <text class="label" x="900" y="400">P2 Express API</text>
  <text class="small" x="900" y="422">Auth · Sync · Match</text>
  <text class="small" x="900" y="442">Jobs · LINE · OCR</text>

  <!-- Entry point badges -->
  <rect x="560" y="210" width="120" height="28" rx="6" fill="#D32F2F"/>
  <text class="flow-num" x="620" y="229" text-anchor="middle">ENTRY · HTTPS</text>
  <rect x="820" y="300" width="160" height="28" rx="6" fill="#D32F2F"/>
  <text class="flow-num" x="900" y="319" text-anchor="middle">ENTRY · /api · webhook</text>

  <!-- ========== DATA STORES (right) ========== -->
  <!-- D1 MongoDB -->
  <line x1="1240" y1="280" x2="1500" y2="280" stroke="#E46C31" stroke-width="2.5"/>
  <line x1="1240" y1="360" x2="1500" y2="360" stroke="#E46C31" stroke-width="2.5"/>
  <rect class="store" x="1240" y="280" width="260" height="80" rx="0"/>
  <text class="label" x="1370" y="316">D1 MongoDB</text>
  <text class="small" x="1370" y="338">users · tors · matches</text>

  <!-- D2 Uploads -->
  <line x1="1240" y1="460" x2="1500" y2="460" stroke="#E46C31" stroke-width="2.5"/>
  <line x1="1240" y1="540" x2="1500" y2="540" stroke="#E46C31" stroke-width="2.5"/>
  <rect class="store" x="1240" y="460" width="260" height="80" rx="0"/>
  <text class="label" x="1370" y="496">D2 File Uploads</text>
  <text class="small" x="1370" y="518">certificates · PDFs</text>

  <!-- ========== NUMBERED FLOWS ========== -->
  <!-- helper for numbered circle -->
  <!-- 1 User -> P1 -->
  <path class="flow" d="M 240 255 H 500"/>
  <circle class="num-bg" cx="370" cy="255" r="12"/>
  <text class="flow-num" x="370" y="259" text-anchor="middle">1</text>

  <!-- 2 P1 -> P2 -->
  <path class="flow" d="M 700 340 C 760 360, 800 380, 800 380"/>
  <path class="flow" d="M 800 380 L 830 390"/>
  <circle class="num-bg" cx="770" cy="365" r="12"/>
  <text class="flow-num" x="770" y="369" text-anchor="middle">2</text>

  <!-- 3 Google <-> P2 -->
  <path class="flow" d="M 240 365 H 400 V 420 H 770"/>
  <circle class="num-bg" cx="500" cy="365" r="12"/>
  <text class="flow-num" x="500" y="369" text-anchor="middle">3</text>

  <!-- 4 P2 <-> D1 -->
  <path class="flow" d="M 1030 400 H 1240"/>
  <circle class="num-bg" cx="1135" cy="400" r="12"/>
  <text class="flow-num" x="1135" y="404" text-anchor="middle">4</text>

  <!-- 5 P2 <-> D2 -->
  <path class="flow" d="M 1000 480 H 1240"/>
  <circle class="num-bg" cx="1120" cy="480" r="12"/>
  <text class="flow-num" x="1120" y="484" text-anchor="middle">5</text>

  <!-- 6 TOR sources -> P2 -->
  <path class="flow" d="M 240 475 H 420 V 460 H 770"/>
  <circle class="num-bg" cx="520" cy="475" r="12"/>
  <text class="flow-num" x="520" y="479" text-anchor="middle">6</text>

  <!-- 7 Vertex <-> P2 -->
  <path class="flow" d="M 240 585 H 420 V 500 H 780"/>
  <circle class="num-bg" cx="520" cy="585" r="12"/>
  <text class="flow-num" x="520" y="589" text-anchor="middle">7</text>

  <!-- 8 LINE <-> P2 -->
  <path class="flow" d="M 240 695 H 420 V 520 H 790"/>
  <circle class="num-bg" cx="520" cy="695" r="12"/>
  <text class="flow-num" x="520" y="699" text-anchor="middle">8</text>

  <!-- Legend / flow key -->
  <rect class="legend-box" x="480" y="620" width="640" height="130" rx="8"/>
  <text class="legend" x="500" y="648" font-weight="700">Numbered data flows</text>
  <text class="legend" x="500" y="672">1 Browser ” UI (pages) · 2 UI ” API (HTTPS + JWT cookie) · 3 Google ID token verify</text>
  <text class="legend" x="500" y="694">4 API ” MongoDB CRUD · 5 Certificates / files · 6 Sync TOR feeds ’ API</text>
  <text class="legend" x="500" y="716">7 Vertex OCR / match · 8 LINE webhook + weekly digest</text>
  <text class="legend" x="500" y="738" fill="#D32F2F">Dashed red = trust boundaries (attack surfaces at crossings)</text>
</svg>
